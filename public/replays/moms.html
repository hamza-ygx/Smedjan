<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Momskalkylator</title>
<style>
:root{--ink:#1b2236;--muted:#6b7385;--line:#e6e8ee;--bg:#f5f6f9;--card:#fff;--accent:#e8590c;--accent-soft:#fff1e8;--ok:#1f9d63}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:radial-gradient(1200px 500px at 50% -10%,#fff 0,var(--bg) 60%);background-color:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:28px 24px;display:flex;flex-direction:column;gap:18px}
h1{font-size:30px;font-weight:750;letter-spacing:-.02em;text-align:center;margin-bottom:4px}
h1 span{display:inline-block;padding-bottom:6px;background:linear-gradient(var(--accent),var(--accent)) bottom/100% 4px no-repeat;border-radius:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(20,30,60,.04),0 10px 30px rgba(20,30,60,.06)}
.input{display:flex;align-items:center;gap:16px;padding:16px 30px;transition:border-color .2s,box-shadow .2s;cursor:text}
.input:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(232,89,12,.12),0 10px 30px rgba(20,30,60,.06)}
.input label{font-size:17px;font-weight:600;color:var(--muted);width:72px}
.input input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:68px;font-weight:750;letter-spacing:-.03em;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
.input input::placeholder{color:#c9cdd8}
.input .unit{font-size:22px;font-weight:600;color:var(--muted);width:72px;text-align:right}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#e9ebf1;border-radius:12px;padding:4px;position:relative;width:420px;margin:0 auto}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--accent);border-radius:9px;box-shadow:0 3px 10px rgba(232,89,12,.3);transition:transform .25s cubic-bezier(.3,.7,.3,1)}
.seg.inkl::before{transform:translateX(100%)}
.seg button{position:relative;z-index:1;font:inherit;font-size:15px;font-weight:650;border:0;background:none;height:38px;color:var(--muted);cursor:pointer;transition:color .2s}
.seg button.on{color:#fff}
.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rate{font:inherit;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);transition:transform .15s,border-color .15s,box-shadow .15s,background .15s}
.rate:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,30,60,.08)}
.rate b{font-size:30px;font-weight:750;letter-spacing:-.02em}
.rate small{font-size:12.5px;color:var(--muted);font-weight:500}
.rate.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 6px 18px rgba(232,89,12,.16)}
.rate.on b{color:var(--accent)}
.result{padding:10px 30px 12px}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;font-size:20px}
.row span:first-child{color:var(--muted);font-weight:500}
.row .v{font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.row.total{border-top:2px solid var(--ink);margin-top:4px;padding-top:14px}
.row.total span:first-child{color:var(--ink);font-weight:750;font-size:22px}
.row.total .v{font-size:40px;font-weight:800;letter-spacing:-.02em}
.v.flash{animation:fl .45s ease}
@keyframes fl{from{color:var(--accent)}}
.row span.tag{font-size:12px;font-weight:650;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:20px;margin-left:8px;vertical-align:2px}
.copy{align-self:center;font:inherit;font-size:15px;font-weight:650;height:44px;padding:0 22px;border-radius:11px;border:1.5px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s,transform .1s,border-color .15s}
.copy:hover{background:#2b3552}.copy:active{transform:translateY(1px)}
.copy.done{background:var(--ok);border-color:var(--ok)}.copy.done svg{display:none}
.copy svg{width:17px;height:17px}
@media(max-width:600px){.input input{font-size:40px}.seg{width:100%}.rate small{font-size:11px}}
</style>
</head>
<body>
<div class="wrap">
  <h1><span>Momskalkylator</span></h1>

  <div class="card input" onclick="document.getElementById('amt').focus()">
    <label for="amt">Belopp</label>
    <input id="amt" inputmode="decimal" value="10 000" placeholder="0" autocomplete="off" aria-label="Belopp i kronor">
    <span class="unit">kr</span>
  </div>

  <div class="seg" id="seg" role="tablist">
    <button class="on" data-mode="exkl">exkl. moms</button>
    <button data-mode="inkl">inkl. moms</button>
  </div>

  <div class="rates" id="rates">
    <button class="rate on" data-r="25"><b>25 %</b><small>Standard</small></button>
    <button class="rate" data-r="12"><b>12 %</b><small>Livsmedel &amp; restaurang</small></button>
    <button class="rate" data-r="6"><b>6 %</b><small>Böcker &amp; persontransport</small></button>
  </div>

  <div class="card result">
    <div class="row"><span>Netto</span><span class="v" id="net">10 000 kr</span></div>
    <div class="row"><span>Moms<span class="tag" id="rtag">25 %</span></span><span class="v" id="vat">2 500 kr</span></div>
    <div class="row total"><span>Totalt</span><span class="v" id="tot">12 500 kr</span></div>
  </div>

  <button class="copy" id="copy">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 01-1-1V4a1 1 0 011-1h10a1 1 0 011 1v1"/></svg>
    <span id="copyTxt">Kopiera resultat</span>
  </button>
</div>

<script>
const $=id=>document.getElementById(id);
const fmt=v=>new Intl.NumberFormat("sv-SE",{style:"currency",currency:"SEK",minimumFractionDigits:Math.round(v*100)%100?2:0,maximumFractionDigits:2}).format(v);
const grp=new Intl.NumberFormat("sv-SE");
let rate=25,mode="exkl";

function parse(s){const n=parseFloat(s.replace(/[\s ]/g,"").replace(",","."));return isNaN(n)?0:n}

function setVal(el,text){if(el.textContent!==text){el.textContent=text;el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")}}

function calc(){
  const a=parse($("amt").value);
  const net=mode==="exkl"?a:a/(1+rate/100);
  const tot=mode==="exkl"?a*(1+rate/100):a;
  setVal($("net"),fmt(Math.round(net*100)/100));
  setVal($("vat"),fmt(Math.round((tot-net)*100)/100));
  setVal($("tot"),fmt(Math.round(tot*100)/100));
  $("rtag").textContent=rate+" %";
}

$("amt").addEventListener("input",e=>{
  const el=e.target;
  let raw=el.value.replace(/[^\d,.]/g,"").replace(".",",");
  const parts=raw.split(",");
  let int=parts[0].replace(/^0+(?=\d)/,"").slice(0,12);
  let out=int?grp.format(+int):"";
  if(parts.length>1)out=(out||"0")+","+parts.slice(1).join("").slice(0,2);
  el.value=out;
  calc();
});
let justF=false;
$("amt").addEventListener("focus",e=>{e.target.select();justF=true});
$("amt").addEventListener("mouseup",e=>{if(justF){e.preventDefault();justF=false}});

$("seg").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  mode=b.dataset.mode;
  $("seg").classList.toggle("inkl",mode==="inkl");
  $("seg").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
  calc();
});

$("rates").addEventListener("click",e=>{
  const b=e.target.closest(".rate");if(!b)return;
  rate=+b.dataset.r;
  $("rates").querySelectorAll(".rate").forEach(x=>x.classList.toggle("on",x===b));
  calc();
});

let ct;
$("copy").addEventListener("click",async()=>{
  const text=`Netto: ${$("net").textContent}\nMoms ${rate} %: ${$("vat").textContent}\nTotalt: ${$("tot").textContent}`;
  let ok=false;
  try{await navigator.clipboard.writeText(text);ok=true}catch(err){
    const t=document.createElement("textarea");t.value=text;t.style.cssText="position:fixed;opacity:0";document.body.appendChild(t);t.select();
    try{ok=document.execCommand("copy")}catch(e2){}
    t.remove();
  }
  $("copy").classList.toggle("done",ok);
  $("copyTxt").textContent=ok?"✓ Kopierat!":"Kunde inte kopiera";
  clearTimeout(ct);ct=setTimeout(()=>{$("copy").classList.remove("done");$("copyTxt").textContent="Kopiera resultat"},2000);
});

calc();
</script>
</body>
</html>
