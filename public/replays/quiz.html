<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekonomiquiz</title>
<style>
:root{--ink:#1b2236;--muted:#6b7385;--faint:#a3a9b7;--line:#e6e8ee;--bg:#f5f6f9;--card:#fff;--accent:#e8590c;--accent-soft:#fff1e8;--ok:#1f9d63;--ok-soft:#e7f6ee;--bad:#d64545;--bad-soft:#fdecec}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:radial-gradient(1200px 500px at 50% -10%,#fff 0,var(--bg) 60%);background-color:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:36px 24px 28px;display:flex;flex-direction:column;gap:16px}
h1{font-size:32px;font-weight:750;letter-spacing:-.02em;text-align:center}
h1 span{display:inline-block;padding-bottom:6px;background:linear-gradient(var(--accent),var(--accent)) bottom/100% 4px no-repeat}
.meta{display:flex;justify-content:space-between;align-items:baseline;font-size:16px;color:var(--muted);font-weight:500;margin-top:4px}
.meta b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.score b{display:inline-block}
.score b.pop{animation:pop .45s ease}
@keyframes pop{40%{transform:scale(1.45);color:var(--ok)}}
.bar{height:10px;border-radius:5px;background:#e6e8ee;overflow:hidden;margin-top:-6px}
.bar i{display:block;height:100%;width:10%;border-radius:5px;background:linear-gradient(90deg,#f08a3c,var(--accent));transition:width .45s cubic-bezier(.3,.7,.3,1)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(20,30,60,.04),0 10px 30px rgba(20,30,60,.06)}
.q{padding:26px 34px 28px;min-height:132px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.tag{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:20px}
.q h2{font-size:27px;font-weight:700;letter-spacing:-.015em;line-height:1.25}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ans{font:inherit;display:flex;align-items:center;gap:16px;text-align:left;height:76px;padding:0 20px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;font-weight:650;cursor:pointer;box-shadow:0 1px 2px rgba(20,30,60,.04);transition:transform .15s,border-color .15s,box-shadow .15s,background .2s,opacity .2s}
.ans:hover:not(:disabled){transform:translateY(-2px);border-color:#cfd3dd;box-shadow:0 8px 20px rgba(20,30,60,.08)}
.ans:disabled{cursor:default}
.ans .l{width:38px;height:38px;flex:none;border-radius:10px;background:#eef0f4;color:var(--muted);display:grid;place-items:center;font-size:16px;font-weight:750;transition:background .2s,color .2s}
.ans .ico{margin-left:auto;font-size:22px;font-weight:800;opacity:0;transform:scale(.5);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.ans.right{border-color:var(--ok);background:var(--ok-soft);color:#14663f}
.ans.right .l{background:var(--ok);color:#fff}
.ans.wrong{border-color:var(--bad);background:var(--bad-soft);color:#9c2c2c;animation:shake .4s}
.ans.wrong .l{background:var(--bad);color:#fff}
.ans.right .ico,.ans.wrong .ico{opacity:1;transform:none}
.ans.dim{opacity:.5}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.foot{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:52px}
.fb{font-size:15.5px;color:var(--muted);line-height:1.4;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s}
.fb.show{opacity:1;transform:none}
.fb b{font-weight:700}
.fb.ok b{color:var(--ok)}.fb.no b{color:var(--bad)}
.btn{font:inherit;font-size:17px;font-weight:700;height:52px;padding:0 28px;border-radius:13px;border:0;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;gap:10px;flex:none;box-shadow:0 6px 16px rgba(232,89,12,.3);transition:background .15s,transform .15s,box-shadow .15s,opacity .2s}
.btn:hover:not(:disabled){background:#d24f08;transform:translateY(-1px);box-shadow:0 10px 22px rgba(232,89,12,.36)}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.btn svg{width:18px;height:18px;transition:transform .2s}
.btn:hover:not(:disabled) svg{transform:translateX(3px)}
.end{display:none;padding:34px 40px 30px;text-align:center;flex-direction:column;align-items:center;gap:6px;animation:rise .5s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.done .play{display:none}.done .end{display:flex}
.trophy{font-size:68px;line-height:1;animation:bounce 1s cubic-bezier(.3,1.6,.5,1)}
@keyframes bounce{from{transform:scale(.2) rotate(-20deg)}}
.big{font-size:52px;font-weight:800;letter-spacing:-.03em;margin-top:8px;font-variant-numeric:tabular-nums}
.big small{font-size:24px;color:var(--muted);font-weight:600}
.msg{font-size:18px;color:var(--muted);font-weight:500;margin-bottom:14px}
.dots{display:flex;gap:8px;margin-bottom:22px}
.dots span{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:var(--ok)}
.dots span.x{background:var(--bad)}
@media(max-width:640px){.answers{grid-template-columns:1fr}.ans{height:60px}.q h2{font-size:22px}.foot{flex-direction:column;align-items:stretch}.dots{flex-wrap:wrap;justify-content:center}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <h1><span>Ekonomiquiz</span></h1>

  <div class="meta">
    <span>Fråga <b id="num">1</b> / <b id="tot">10</b></span>
    <span class="score">Poäng: <b id="score">0</b></span>
  </div>
  <div class="bar"><i id="bar"></i></div>

  <div class="play">
    <div class="card q">
      <span class="tag" id="tag">Moms</span>
      <h2 id="question">Vad är normal momssats i Sverige?</h2>
    </div>
  </div>

  <div class="play answers" id="answers">
    <button class="ans"><span class="l">A</span><span class="t">6 %</span><span class="ico"></span></button>
    <button class="ans"><span class="l">B</span><span class="t">12 %</span><span class="ico"></span></button>
    <button class="ans"><span class="l">C</span><span class="t">25 %</span><span class="ico"></span></button>
    <button class="ans"><span class="l">D</span><span class="t">30 %</span><span class="ico"></span></button>
  </div>

  <div class="play foot">
    <p class="fb" id="fb">&nbsp;</p>
    <button class="btn" id="next" disabled><span id="nextTxt">Nästa</span><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h12M11 5l5 5-5 5"/></svg></button>
  </div>

  <div class="card end">
    <div class="trophy" id="trophy">🏆</div>
    <div class="big"><span id="final">0</span> <small>av 10 rätt</small></div>
    <p class="msg" id="msg">Snyggt jobbat!</p>
    <div class="dots" id="dots"></div>
    <button class="btn" id="again">Spela igen<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a6 6 0 1 0 2-4.5M4 3v3.5h3.5"/></svg></button>
  </div>
</div>
<script>
const Q=[
  ['Moms','Vad är normal momssats i Sverige?',['6 %','12 %','25 %','30 %'],2,'Normalskattesatsen är 25 % och gäller för de flesta varor och tjänster.'],
  ['Bokföring','Hur länge ska räkenskapsinformation sparas enligt bokföringslagen?',['3 år','5 år','7 år','10 år'],2,'Räkenskapsinformation ska bevaras i sju år efter räkenskapsårets slut.'],
  ['Skatt','Hur hög är bolagsskatten för aktiebolag?',['18,5 %','20,6 %','22 %','26,3 %'],1,'Bolagsskatten har legat på 20,6 % sedan 2021.'],
  ['Moms','Vilken momssats gäller för böcker och tidningar?',['0 %','6 %','12 %','25 %'],1,'Böcker, tidningar och persontransporter har 6 % moms.'],
  ['Bokföring','Vilket BAS-konto används normalt för företagets bankkonto?',['1510','1910','1930','2440'],2,'1930 är Företagskonto / checkräkningskonto i BAS-kontoplanen.'],
  ['Skatt','Vad innebär det att ha F-skatt?',['Arbetsgivaren drar skatten','Man betalar själv sin skatt och egenavgifter','Man slipper betala moms','Man betalar fastighetsavgift'],1,'Med F-skatt betalar företagaren själv preliminärskatt och egenavgifter.'],
  ['Moms','Vilken momssats gäller för hotellövernattningar?',['6 %','12 %','25 %','Momsfritt'],1,'Rumsuthyrning i hotellverksamhet har 12 % moms.'],
  ['Bokföring','Vilken kontoklass i BAS innehåller rörelsens intäkter?',['Klass 1','Klass 2','Klass 3','Klass 4'],2,'Kontoklass 3 är rörelsens inkomster och intäkter.'],
  ['Skatt','Hur höga är de fulla arbetsgivaravgifterna?',['21,42 %','26,50 %','31,42 %','38,00 %'],2,'De fulla arbetsgivaravgifterna är 31,42 % av lönen.'],
  ['Moms','Hur ofta redovisar ett företag moms om omsättningen överstiger 40 miljoner kr?',['Varje månad','Varje kvartal','Varje halvår','En gång per år'],0,'Över 40 miljoner kr i beskattningsunderlag redovisas momsen månadsvis.']
];
const $=s=>document.getElementById(s);
const btns=[...document.querySelectorAll('.ans')];
let i=0,score=0,answered=false,hist=[];
$('tot').textContent=Q.length;

function show(){
  const [tag,q,opts]=Q[i];
  answered=false;
  $('num').textContent=i+1;
  $('tag').textContent=tag;
  $('question').textContent=q;
  $('bar').style.width=((i+1)/Q.length*100)+'%';
  btns.forEach((b,k)=>{b.className='ans';b.disabled=false;b.querySelector('.t').textContent=opts[k];b.querySelector('.ico').textContent=''});
  $('fb').className='fb';$('fb').innerHTML='&nbsp;';
  $('next').disabled=true;
  $('nextTxt').textContent=i===Q.length-1?'Visa resultat':'Nästa';
}

function pick(k){
  if(answered)return;
  answered=true;
  const [, , ,right,why]=Q[i],ok=k===right;
  hist.push(ok);
  btns.forEach((b,n)=>{
    b.disabled=true;
    if(n===right){b.classList.add('right');b.querySelector('.ico').textContent='✓'}
    else if(n===k){b.classList.add('wrong');b.querySelector('.ico').textContent='✕'}
    else b.classList.add('dim');
  });
  if(ok){score++;const s=$('score');s.textContent=score;s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop')}
  const fb=$('fb');
  fb.className='fb show '+(ok?'ok':'no');
  fb.innerHTML='<b>'+(ok?'Rätt!':'Tyvärr fel.')+'</b> ';
  fb.append(why);
  $('next').disabled=false;$('next').focus();
}

function finish(){
  $('app').classList.add('done');
  $('final').textContent=score;
  const pct=score/Q.length;
  $('trophy').style.filter=pct>=.5?'':'grayscale(.6)';
  $('msg').textContent=pct===1?'Fullpott! Du är redo för bokslutet.':pct>=.8?'Imponerande – riktig ekonomiexpert!':pct>=.5?'Bra jobbat! Lite repetition så sitter det.':'Bra försök – dags att fräscha upp kunskaperna.';
  $('dots').innerHTML=hist.map((ok,n)=>'<span class="'+(ok?'':'x')+'" title="Fråga '+(n+1)+'">'+(n+1)+'</span>').join('');
}

btns.forEach((b,k)=>b.addEventListener('click',()=>pick(k)));
$('next').addEventListener('click',()=>{if(!answered)return;if(i<Q.length-1){i++;show()}else finish()});
$('again').addEventListener('click',()=>{i=0;score=0;hist=[];$('score').textContent=0;$('app').classList.remove('done');show()});
document.addEventListener('keydown',e=>{
  const k='abcd'.indexOf(e.key.toLowerCase()),d='1234'.indexOf(e.key);
  if($('app').classList.contains('done'))return;
  if(k>-1)pick(k);else if(d>-1)pick(d);
});
show();
</script>
</body>
</html>
