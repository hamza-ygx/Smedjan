<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mina utlägg</title>
<style>
:root{--ink:#1b2236;--muted:#6b7385;--line:#e6e8ee;--bg:#f5f6f9;--card:#fff;--accent:#e8590c;--accent-soft:#fff1e8;--ok:#1f9d63;--radius:14px}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:22px 32px 24px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:28px;font-weight:750;letter-spacing:-.02em;position:relative;padding-bottom:4px}
h1::after{content:"";position:absolute;left:0;bottom:-2px;width:64px;height:4px;border-radius:4px;background:var(--accent)}
.who{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2a3557,#4a5a8a);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(20,30,60,.04),0 8px 24px rgba(20,30,60,.05)}
form{display:grid;grid-template-columns:1fr 1fr 1fr 120px 120px;grid-template-areas:"d k b r r" "s s s add add";gap:12px 16px;padding:16px 20px;margin-bottom:18px;align-items:end}
.f{display:flex;flex-direction:column;gap:5px}
.f label,.lbl{font-size:12px;font-weight:600;color:var(--muted)}
input,select{font:inherit;color:var(--ink);height:40px;padding:0 12px;border:1px solid #d8dbe4;border-radius:10px;background:#fff;transition:border-color .15s,box-shadow .15s;width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,89,12,.15)}
.amt{position:relative}.amt span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted)}.amt input{padding-right:34px}
.drop{grid-area:r;height:40px;border:1.5px dashed #c5cad6;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;text-align:center;padding:8px;transition:.15s}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.drop.has small{display:block}.drop.has #dropTxt{display:none}
.drop.has{border-style:solid;border-color:var(--ok);color:var(--ok);background:#effaf4}
.drop svg{width:18px;height:18px;flex:none}.drop small{display:none;font-weight:500;font-size:12px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop input{display:none}
.btn{font:inherit;font-weight:650;height:40px;border:0;border-radius:10px;cursor:pointer;padding:0 18px;transition:transform .1s,box-shadow .15s,background .15s}
.btn:active{transform:translateY(1px)}
.primary{grid-area:add;background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(232,89,12,.28)}
.primary:hover{background:#d24f08}
main{display:grid;grid-template-columns:1fr 320px;gap:18px}
.list{padding:6px 0 0;display:flex;flex-direction:column}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:10px 20px;border-bottom:1px solid var(--line)}
td{padding:10px 20px;border-bottom:1px solid var(--line)}
th.r,td.r{text-align:right}
tbody tr{transition:background .15s}tbody tr:hover{background:#fafbfd}
tbody tr.new{animation:pop .5s ease}
@keyframes pop{from{background:var(--accent-soft)}to{background:transparent}}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%}
.rate{font-size:11px;color:var(--muted);margin-left:6px;font-weight:500}
.clip{color:var(--muted);margin-left:6px}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.del{border:0;background:none;color:#b0b5c2;cursor:pointer;font-size:16px;width:26px;height:26px;border-radius:6px;opacity:0;transition:.15s}
tr:hover .del{opacity:1}.del:hover{background:#fdecec;color:#d23}
.scroll{max-height:262px;overflow:auto}
.tot{display:grid;grid-template-columns:1fr auto;gap:4px 24px;padding:14px 20px 16px;margin-left:auto;min-width:300px;margin-top:auto}
.tot .big{font-size:22px;font-weight:750;letter-spacing:-.01em}
.tot .sub{color:var(--muted)}
.side{display:flex;flex-direction:column;gap:14px}
.chart{padding:16px 20px;display:flex;flex-direction:column;align-items:center;flex:1}
.chart h3{font-size:13px;font-weight:650;color:var(--muted);align-self:flex-start;text-transform:uppercase;letter-spacing:.05em}
.pie{width:150px;height:150px;border-radius:50%;margin:12px 0;position:relative;transition:background .4s}
.pie::after{content:"";position:absolute;inset:32px;border-radius:50%;background:#fff}
.legend{width:100%;display:flex;flex-direction:column;gap:5px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}.legend b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.attest{width:100%;height:46px;background:var(--ink);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.attest:hover{background:#2b3552}.attest.done{background:var(--ok)}
.badge{font-size:11px;font-weight:650;padding:2px 8px;border-radius:20px;background:#effaf4;color:var(--ok)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){form{grid-template-columns:1fr 1fr;grid-template-areas:"d k" "b r" "s s" "add add"}main{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Mina utlägg</h1>
  <div class="who"><span>Oktober 2026</span><div class="avatar">AL</div></div>
</header>

<form class="card" id="form" autocomplete="off">
  <div class="f" style="grid-area:d"><label for="date">Datum</label><input type="date" id="date" value="2026-10-06" required></div>
  <div class="f" style="grid-area:k"><label for="cat">Kategori</label>
    <select id="cat"><option>Resa</option><option>Mat</option><option>Hotell</option><option>Material</option><option>Övrigt</option></select></div>
  <div class="f" style="grid-area:b"><label for="amt">Belopp inkl. moms</label><div class="amt"><input id="amt" inputmode="decimal" placeholder="0" required><span>kr</span></div></div>
  <label class="drop" id="drop">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 01-7.8-7.8l8.6-8.6a3.7 3.7 0 015.2 5.2l-8.6 8.6a1.8 1.8 0 01-2.6-2.6l7.9-7.9"/></svg>
    <span id="dropTxt">Bifoga kvitto</span><small id="dropSub"></small>
    <input type="file" id="file" accept="image/*,.pdf">
  </label>
  <div class="f" style="grid-area:s"><label for="desc">Beskrivning</label><input id="desc" placeholder="Beskrivning…" required></div>
  <button class="btn primary" type="submit">+ Lägg till</button>
</form>

<main>
  <section class="card list">
    <div class="scroll">
    <table>
      <thead><tr><th>Datum</th><th>Kategori</th><th>Beskrivning</th><th class="r">Belopp</th><th></th></tr></thead>
      <tbody id="rows">
        <tr><td>2 okt</td><td>Resa</td><td>Tåg Sthlm–Gbg</td><td class="r num">1 245 kr</td><td></td></tr>
        <tr><td>3 okt</td><td>Mat</td><td>Kundlunch</td><td class="r num">860 kr</td><td></td></tr>
        <tr><td>4 okt</td><td>Material</td><td>Pärmar</td><td class="r num">329 kr</td><td></td></tr>
        <tr><td>5 okt</td><td>Resa</td><td>Taxi</td><td class="r num">412 kr</td><td></td></tr>
      </tbody>
    </table>
    </div>
    <div class="tot">
      <span class="big">Totalt:</span><span class="big num" id="total">2 846 kr</span>
      <span class="sub">varav moms:</span><span class="sub num" id="vat">≈ 252 kr</span>
    </div>
  </section>

  <aside class="side">
    <div class="card chart">
      <h3>Per kategori</h3>
      <div class="pie" id="pie" style="background:conic-gradient(#e8590c 0 58%,#2a3557 0 88%,#b8bfcf 0)"></div>
      <div class="legend" id="legend"></div>
    </div>
    <button class="btn attest" id="attest" type="button">Skicka för attest</button>
  </aside>
</main>
</div>
<div class="toast" id="toast"></div>

<script>
const CATS={Resa:{rate:6,color:"#e8590c"},Mat:{rate:12,color:"#2a3557"},Hotell:{rate:12,color:"#7c8db5"},Material:{rate:25,color:"#b8bfcf"},"Övrigt":{rate:25,color:"#f2b37d"}};
const kr=new Intl.NumberFormat("sv-SE",{style:"currency",currency:"SEK",maximumFractionDigits:0});
const kr2={format:v=>new Intl.NumberFormat("sv-SE",{style:"currency",currency:"SEK",minimumFractionDigits:v%1?2:0,maximumFractionDigits:2}).format(v)};
const dfmt=new Intl.DateTimeFormat("sv-SE",{day:"numeric",month:"short"});
const $=id=>document.getElementById(id);
let items=[
  {date:"2026-10-02",cat:"Resa",desc:"Tåg Sthlm–Gbg",amount:1245,receipt:true},
  {date:"2026-10-03",cat:"Mat",desc:"Kundlunch",amount:860,receipt:true},
  {date:"2026-10-04",cat:"Material",desc:"Pärmar",amount:329,receipt:false},
  {date:"2026-10-05",cat:"Resa",desc:"Taxi",amount:412,receipt:true}];
let sent=false,fileName="",lastNew=-1;
const vatOf=i=>i.amount*CATS[i.cat].rate/(100+CATS[i.cat].rate);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  items.sort((a,b)=>a.date.localeCompare(b.date));
  $("rows").innerHTML=items.map((i,n)=>`<tr class="${i._new?"new":""}"><td>${dfmt.format(new Date(i.date+"T12:00")).replace(".","")}</td>
    <td><span class="tag"><span class="dot" style="background:${CATS[i.cat].color}"></span>${i.cat}<span class="rate">${CATS[i.cat].rate} %</span></span></td>
    <td>${esc(i.desc)}${i.receipt?'<span class="clip" title="Kvitto bifogat">📎</span>':""}</td>
    <td class="r num">${kr2.format(i.amount)}</td>
    <td class="r">${sent?"":`<button class="del" data-n="${n}" title="Ta bort">✕</button>`}</td></tr>`).join("");
  items.forEach(i=>delete i._new);
  const total=items.reduce((s,i)=>s+i.amount,0),vat=items.reduce((s,i)=>s+vatOf(i),0);
  $("total").textContent=kr2.format(total);
  $("vat").textContent="≈ "+kr.format(vat);
  const per={};items.forEach(i=>per[i.cat]=(per[i.cat]||0)+i.amount);
  const keys=Object.keys(per).sort((a,b)=>per[b]-per[a]);
  let acc=0;
  $("pie").style.background=total?"conic-gradient("+keys.map(k=>{const a=acc;acc+=per[k]/total*100;return `${CATS[k].color} ${a}% ${acc}%`}).join(",")+")":"#eef0f4";
  $("legend").innerHTML=keys.map(k=>`<div><span class="dot" style="background:${CATS[k].color}"></span>${k}<b>${kr.format(per[k])}</b></div>`).join("")||'<div style="color:var(--muted)">Inga utlägg ännu</div>';
}

$("rows").addEventListener("click",e=>{const b=e.target.closest(".del");if(b){items.splice(+b.dataset.n,1);render()}});

$("form").addEventListener("submit",e=>{
  e.preventDefault();
  if(sent){toast("Rapporten är redan skickad för attest");return}
  const amount=parseFloat($("amt").value.replace(/\s/g,"").replace(",","."));
  if(!(amount>0)){$("amt").focus();$("amt").style.borderColor="#d23";return}
  items.push({date:$("date").value||"2026-10-06",cat:$("cat").value,desc:$("desc").value.trim(),amount,receipt:!!fileName,_new:true});
  $("amt").value="";$("desc").value="";$("amt").style.borderColor="";setFile("");
  render();toast("Utlägget har lagts till");
});
$("amt").addEventListener("input",()=>$("amt").style.borderColor="");

function setFile(name){
  fileName=name;$("drop").classList.toggle("has",!!name);
  $("dropSub").textContent=name;
  if(!name)$("file").value="";
}
$("file").addEventListener("change",e=>setFile(e.target.files[0]?.name||""));
["dragover","dragenter"].forEach(t=>$("drop").addEventListener(t,e=>{e.preventDefault();$("drop").classList.add("over")}));
["dragleave","drop"].forEach(t=>$("drop").addEventListener(t,e=>{e.preventDefault();$("drop").classList.remove("over")}));
$("drop").addEventListener("drop",e=>{const f=e.dataTransfer.files[0];if(f)setFile(f.name)});

$("attest").addEventListener("click",()=>{
  if(!items.length){toast("Lägg till minst ett utlägg först");return}
  sent=!sent;
  $("attest").classList.toggle("done",sent);
  $("attest").innerHTML=sent?'✓ Skickad för attest <span class="badge" style="background:rgba(255,255,255,.2);color:#fff">Ångra</span>':"Skicka för attest";
  render();toast(sent?`${items.length} utlägg på ${kr2.format(items.reduce((s,i)=>s+i.amount,0))} skickade till din chef`:"Attestbegäran återkallad");
});

let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2600)}
render();
</script>
</body>
</html>
