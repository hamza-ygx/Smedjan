<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luffarschack</title>
<style>
:root{--ink:#1b2236;--muted:#6b7385;--line:#e6e8ee;--bg:#f5f6f9;--card:#fff;--accent:#e8590c;--accent-soft:#fff1e8;--x:#1f2a44;--x-soft:#eef1f7;--win:#e03131}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:radial-gradient(1100px 520px at 50% -10%,#fff 0,var(--bg) 60%);background-color:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto;padding:22px 20px 20px;display:flex;flex-direction:column;align-items:stretch;gap:14px}
h1{font-size:32px;font-weight:780;letter-spacing:-.02em;text-align:center}
h1 span{display:inline-block;padding-bottom:6px;background:linear-gradient(var(--accent),var(--accent)) bottom/100% 4px no-repeat}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.turn{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;color:var(--muted);min-height:38px}
.turn b{color:var(--ink);font-weight:750}
.badge{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--x-soft);transition:background .25s,transform .25s}
.badge svg{width:20px;height:20px}
.badge.o{background:var(--accent-soft)}
.turn.pulse .badge{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.18)}}
.turn.won b{color:var(--win)}
.seg{display:flex;background:#e9ebf0;border-radius:11px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:13.5px;font-weight:650;border:0;background:none;color:var(--muted);padding:8px 12px;border-radius:9px;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,30,60,.12)}
.board{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 1px 2px rgba(20,30,60,.04),0 14px 36px rgba(20,30,60,.08)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:10px;width:min(100%,360px);aspect-ratio:1;margin:0 auto}
.cell{font:inherit;border:0;border-radius:14px;background:#f3f4f8;cursor:pointer;display:grid;place-items:center;position:relative;transition:background .18s,transform .12s,box-shadow .2s}
.cell:hover:not(:disabled){background:#eceef4}
.cell:active:not(:disabled){transform:scale(.97)}
.cell:disabled{cursor:default}
.cell svg{width:58%;height:58%;overflow:visible}
.cell .mk path,.cell .mk circle{fill:none;stroke-width:12;stroke-linecap:round}
.cell .mk.x path{stroke:var(--x);stroke-dasharray:120;stroke-dashoffset:120;animation:draw .28s ease-out forwards}
.cell .mk.x path+path{animation-delay:.14s}
.cell .mk.o circle{stroke:var(--accent);stroke-dasharray:260;stroke-dashoffset:260;animation:draw .42s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.cell .ghost{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.cell:hover:not(:disabled) .ghost{opacity:.16}
.cell .ghost path,.cell .ghost circle{fill:none;stroke-width:12;stroke-linecap:round;stroke:var(--x)}
.cell .ghost circle{stroke:var(--accent)}
.cell.hit{background:#fff4f2;box-shadow:inset 0 0 0 2px rgba(224,49,49,.25)}
.board.over .cell:not(.hit) .mk{opacity:.35;transition:opacity .4s}
.wl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.wl line{stroke:var(--win);stroke-width:9;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .45s cubic-bezier(.5,0,.3,1) .1s forwards;filter:drop-shadow(0 3px 6px rgba(224,49,49,.35))}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 1px 2px rgba(20,30,60,.04)}
.sc span{font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.sc b{font-size:24px;font-weight:780;font-variant-numeric:tabular-nums;display:inline-block}
.sc.x b{color:var(--x)}.sc.o b{color:var(--accent)}.sc.d b{color:var(--muted)}
.sc b.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.45)}}
.actions{display:flex;gap:10px}
.btn{font:inherit;flex:1;font-size:17px;font-weight:700;height:50px;border-radius:13px;border:0;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 16px rgba(232,89,12,.3);transition:background .15s,transform .15s,box-shadow .15s}
.btn:hover{background:#d24f08;transform:translateY(-1px);box-shadow:0 10px 22px rgba(232,89,12,.36)}
.btn svg{width:18px;height:18px;transition:transform .35s}
.btn:hover svg{transform:rotate(-180deg)}
.ghostbtn{font:inherit;font-size:14.5px;font-weight:650;height:50px;padding:0 18px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;transition:color .15s,border-color .15s}
.ghostbtn:hover{color:var(--ink);border-color:#cfd3dd}
@media(max-width:480px){.bar{flex-direction:column;align-items:stretch}.turn{justify-content:center}.seg button{flex:1}.sc{flex-direction:column;gap:0}}
</style>
</head>
<body>
<main class="wrap">
  <h1><span>Luffarschack</span></h1>

  <div class="bar">
    <div class="turn" id="turn" aria-live="polite">
      <div class="badge" id="badge"><svg viewBox="0 0 40 40"><path d="M8 8l24 24M32 8L8 32" stroke="#1f2a44" stroke-width="6" stroke-linecap="round"/></svg></div>
      <span id="status">Tur: <b>X</b></span>
    </div>
    <div class="seg" role="tablist" aria-label="Spelläge">
      <button class="on" data-mode="pvp">Två spelare</button>
      <button data-mode="cpu">Mot datorn</button>
    </div>
  </div>

  <section class="board" id="board">
    <div class="grid" id="grid">
      <button class="cell" aria-label="Ruta 1"></button><button class="cell" aria-label="Ruta 2"></button><button class="cell" aria-label="Ruta 3"></button>
      <button class="cell" aria-label="Ruta 4"></button><button class="cell" aria-label="Ruta 5"></button><button class="cell" aria-label="Ruta 6"></button>
      <button class="cell" aria-label="Ruta 7"></button><button class="cell" aria-label="Ruta 8"></button><button class="cell" aria-label="Ruta 9"></button>
    </div>
  </section>

  <div class="scores">
    <div class="sc x"><span id="lx">X</span><b id="sx">0</b></div>
    <div class="sc o"><span id="lo">O</span><b id="so">0</b></div>
    <div class="sc d"><span>Oavgjort</span><b id="sd">0</b></div>
  </div>

  <div class="actions">
    <button class="btn" id="again"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Ny omgång</button>
    <button class="ghostbtn" id="reset">Nollställ poäng</button>
  </div>
</main>

<script>
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const X_SVG='<path d="M14 14l52 52"/><path d="M66 14L14 66"/>';
const O_SVG='<circle cx="40" cy="40" r="28"/>';
const BADGE={X:'<svg viewBox="0 0 40 40"><path d="M8 8l24 24M32 8L8 32" stroke="#1f2a44" stroke-width="6" stroke-linecap="round"/></svg>',O:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="13" fill="none" stroke="#e8590c" stroke-width="6"/></svg>'};
const $=id=>document.getElementById(id);
const cells=[...document.querySelectorAll('.cell')];
const board=$('board'),grid=$('grid'),turnEl=$('turn'),statusEl=$('status'),badge=$('badge');
let b,turn,over,busy,mode='pvp';
const score={X:0,O:0,D:0};

function svg(cls,inner){return `<svg viewBox="0 0 80 80" class="${cls}">${inner}</svg>`}
function winner(s){for(const l of LINES){const[a,c,d]=l;if(s[a]&&s[a]===s[c]&&s[a]===s[d])return{p:s[a],l}}return s.every(Boolean)?{p:'D'}:null}

function setStatus(html,p,won){
  statusEl.innerHTML=html;badge.innerHTML=BADGE[p]||BADGE.X;badge.className='badge'+(p==='O'?' o':'');
  turnEl.classList.toggle('won',!!won);turnEl.classList.remove('pulse');void turnEl.offsetWidth;turnEl.classList.add('pulse');
}
function name(p){return mode==='cpu'?(p==='X'?'Du':'Datorn'):p}
function showTurn(){
  if(mode==='cpu'&&turn==='O')setStatus('Datorn tänker…','O');
  else setStatus(mode==='cpu'?'Din tur: <b>X</b>':'Tur: <b>'+turn+'</b>',turn);
  cells.forEach((c,i)=>{const g=c.querySelector('.ghost');if(g)g.innerHTML=svg('',turn==='X'?X_SVG:O_SVG)});
}

function newRound(){
  b=Array(9).fill(null);turn='X';over=false;busy=false;
  board.classList.remove('over');board.querySelector('.wl')?.remove();
  cells.forEach(c=>{c.className='cell';c.disabled=false;c.innerHTML='<span class="ghost"></span>'});
  showTurn();
}

function place(i){
  b[i]=turn;const c=cells[i];c.disabled=true;
  c.innerHTML=svg('mk '+turn.toLowerCase(),turn==='X'?X_SVG:O_SVG);
  const w=winner(b);
  if(w){finish(w);return}
  turn=turn==='X'?'O':'X';showTurn();
  if(mode==='cpu'&&turn==='O'){busy=true;setTimeout(()=>{busy=false;if(!over)place(cpuMove())},520)}
}

function finish(w){
  over=true;cells.forEach(c=>c.disabled=true);board.classList.add('over');
  const key=w.p;score[key]++;const el=$(key==='D'?'sd':'s'+key.toLowerCase());
  el.textContent=score[key];el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');
  if(key==='D'){setStatus('Oavgjort – ingen vinnare','X');return}
  w.l.forEach(i=>cells[i].classList.add('hit'));
  drawLine(w.l);
  const msg=mode==='cpu'?(key==='X'?'Du vann! 🎉':'Datorn vann'):'<b>'+key+'</b> vinner! 🎉';
  setStatus(msg,key,true);
}

function drawLine(l){
  const ns='http://www.w3.org/2000/svg',s=document.createElementNS(ns,'svg');s.setAttribute('class','wl');board.appendChild(s);
  const sr=s.getBoundingClientRect(),gw=grid.getBoundingClientRect().width;
  const ctr=i=>{const r=cells[i].getBoundingClientRect();return[r.left+r.width/2-sr.left,r.top+r.height/2-sr.top]};
  let[x1,y1]=ctr(l[0]),[x2,y2]=ctr(l[2]);
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),ext=gw*.13/len;
  x1-=dx*ext;y1-=dy*ext;x2+=dx*ext;y2+=dy*ext;
  s.innerHTML=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="--len:${Math.ceil(len*(1+2*ext))}"/>`;
}

function cpuMove(){
  const free=b.map((v,i)=>v?null:i).filter(v=>v!==null);
  const tryWin=p=>{for(const i of free){const t=b.slice();t[i]=p;const w=winner(t);if(w&&w.p===p)return i}return null};
  let m=tryWin('O');if(m!==null)return m;
  m=tryWin('X');if(m!==null)return m;
  if(!b[4])return 4;
  const corners=[0,2,6,8].filter(i=>!b[i]);
  const pool=corners.length&&Math.random()<.75?corners:free;
  return pool[Math.floor(Math.random()*pool.length)];
}

grid.addEventListener('click',e=>{
  const c=e.target.closest('.cell');if(!c||over||busy)return;
  const i=cells.indexOf(c);if(b[i])return;
  if(mode==='cpu'&&turn==='O')return;
  place(i);
});

document.querySelectorAll('.seg button').forEach(btn=>btn.addEventListener('click',()=>{
  if(btn.dataset.mode===mode)return;
  mode=btn.dataset.mode;
  document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===btn));
  $('lx').textContent=mode==='cpu'?'Du (X)':'X';$('lo').textContent=mode==='cpu'?'Datorn (O)':'O';
  resetScore();newRound();
}));

function resetScore(){score.X=score.O=score.D=0;['sx','so','sd'].forEach(id=>$(id).textContent='0')}
$('again').addEventListener('click',newRound);
$('reset').addEventListener('click',()=>{resetScore();newRound()});
window.addEventListener('resize',()=>{const s=board.querySelector('.wl');if(s&&over){s.remove();const w=winner(b);if(w&&w.l)drawLine(w.l)}});
newRound();
</script>
</body>
</html>
