<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boka ett möte</title>
<style>
:root{--ink:#1b2236;--muted:#6b7385;--line:#e6e8ee;--bg:#f5f6f9;--card:#fff;--accent:#e8590c;--accent-d:#c94c08;--soft:#fff1e8;--ok:#1f9d63;--dis:#b9bfcc}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:radial-gradient(1100px 480px at 20% -10%,#fff 0,var(--bg) 60%);background-color:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:40px 40px 32px}
header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
h1{font-size:38px;font-weight:800;letter-spacing:-.03em;display:inline-block;padding-bottom:6px;background:linear-gradient(var(--accent),var(--accent)) 0 100%/100% 4px no-repeat}
.sub{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--muted);font-size:16px;font-weight:500}
.sub svg{width:17px;height:17px}
.host{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px 10px 10px;box-shadow:0 1px 2px rgba(20,30,60,.04)}
.av{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#ff8a3d,var(--accent));color:#fff;display:grid;place-items:center;font-weight:750;font-size:15px}
.host b{display:block;font-size:14.5px}.host small{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1.05fr 1fr;gap:24px;align-items:stretch}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(20,30,60,.04),0 12px 32px rgba(20,30,60,.06)}
.cal{padding:24px 28px 20px;display:flex;flex-direction:column}
.mhead{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:10px}
.mhead h2{font-size:19px;font-weight:750;min-width:150px;text-align:center;text-transform:capitalize}
.nav{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;transition:background .15s,border-color .15s}
.nav:hover:not(:disabled){background:var(--soft);border-color:#f6c9ad;color:var(--accent)}
.nav:disabled{opacity:.35;cursor:default}
.nav svg{width:16px;height:16px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{font-size:12.5px;font-weight:650;color:var(--muted);padding:6px 0 8px}
.d{position:relative;height:54px;border:0;background:none;border-radius:12px;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;transition:background .15s,color .15s,transform .1s}
.d:not(:disabled):hover{background:var(--soft);color:var(--accent-d)}
.d:disabled{color:var(--dis);cursor:not-allowed;font-weight:500}
.d.full:disabled{text-decoration:line-through;text-decoration-color:#cfd3dc}
.d.today::after{content:"";position:absolute;left:50%;bottom:8px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.d.sel{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(232,89,12,.32)}
.d.sel:hover{background:var(--accent-d);color:#fff}
.d.sel::after{background:#fff}
.legend{display:flex;gap:18px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--accent)}
.legend i.g{background:#e3e6ec}
.side{padding:26px 28px;display:flex;flex-direction:column}
.shead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.shead h2{font-size:20px;font-weight:750}
.shead span{font-size:14px;color:var(--muted);font-weight:500}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.slot{height:52px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:16px;font-weight:650;font-variant-numeric:tabular-nums;transition:all .15s}
.slot:not(:disabled):hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.slot:disabled{background:repeating-linear-gradient(135deg,#f1f2f5 0 6px,#e9ebf0 6px 12px);color:var(--dis);border-color:transparent;cursor:not-allowed;text-decoration:line-through}
.slot.sel{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(232,89,12,.3)}
.slot.sel:hover{color:#fff}
.none{grid-column:1/-1;padding:14px;border-radius:12px;background:#f5f6f9;color:var(--muted);font-size:14px;text-align:center}
label{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:0 0 6px}
.f{margin-bottom:14px}
input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;font-size:15.5px;outline:0;background:#fff;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(232,89,12,.12)}
input.err{border-color:#d64545;box-shadow:0 0 0 4px rgba(214,69,69,.1)}
.msg{font-size:12.5px;color:#d64545;margin-top:5px;min-height:0;display:none}
.msg.on{display:block}
.summary{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin:auto 0 12px;padding-top:6px}
.summary svg{width:17px;height:17px;color:var(--accent);flex:none}
.summary b{color:var(--ink)}
.cta{width:100%;height:52px;border:0;border-radius:13px;background:var(--accent);color:#fff;font-size:17px;font-weight:750;box-shadow:0 10px 22px rgba(232,89,12,.3);transition:background .15s,transform .1s,box-shadow .15s}
.cta:hover{background:var(--accent-d);box-shadow:0 12px 26px rgba(232,89,12,.38)}
.cta:active{transform:translateY(1px)}
.cta.busy{opacity:.75;pointer-events:none}
.ok{text-align:center;margin:auto 0;padding:6px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.ok .ck{width:72px;height:72px;margin:0 auto 16px;border-radius:50%;background:rgba(31,157,99,.12);display:grid;place-items:center}
.ok .ck svg{width:38px;height:38px;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .15s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ok h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.ok p{color:var(--muted);font-size:15px;line-height:1.55}
.when{margin:18px 0;border:1px solid var(--line);border-radius:14px;padding:14px 18px;text-align:left;display:grid;gap:8px;font-size:14.5px}
.when div{display:flex;justify-content:space-between;gap:12px}.when span{color:var(--muted)}.when b{text-align:right}
.ghost{height:44px;padding:0 20px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:650;font-size:15px;transition:border-color .15s,color .15s}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
@media(max-width:860px){.wrap{padding:20px 16px}.grid{grid-template-columns:1fr}header{flex-direction:column;align-items:flex-start;gap:14px}.d{height:44px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Boka ett möte</h1>
      <div class="sub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Bokslutsgenomgång · 45 min</div>
    </div>
    <div class="host"><div class="av">AL</div><div><b>Anna Lindqvist</b><small>Auktoriserad revisor · Teams eller på kontoret</small></div></div>
  </header>

  <div class="grid">
    <section class="card cal">
      <div class="mhead">
        <button class="nav" id="prev" aria-label="Föregående månad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <h2 id="month">oktober 2026</h2>
        <button class="nav" id="next" aria-label="Nästa månad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
      <div class="days" id="days">
        <div class="dow">M</div><div class="dow">T</div><div class="dow">O</div><div class="dow">T</div><div class="dow">F</div><div class="dow">L</div><div class="dow">S</div>
        <span></span><span></span><span></span><button class="d">1</button><button class="d">2</button><button class="d" disabled>3</button><button class="d" disabled>4</button>
        <button class="d">5</button><button class="d full" disabled>6</button><button class="d full" disabled>7</button><button class="d">8</button><button class="d">9</button><button class="d" disabled>10</button><button class="d" disabled>11</button>
        <button class="d">12</button><button class="d">13</button><button class="d sel">14</button><button class="d">15</button><button class="d">16</button><button class="d" disabled>17</button><button class="d" disabled>18</button>
        <button class="d">19</button><button class="d">20</button><button class="d full" disabled>21</button><button class="d">22</button><button class="d">23</button><button class="d" disabled>24</button><button class="d" disabled>25</button>
        <button class="d">26</button><button class="d">27</button><button class="d">28</button><button class="d">29</button><button class="d">30</button><button class="d" disabled>31</button>
      </div>
      <div class="legend"><span><i></i>Vald dag</span><span><i class="g"></i>Fullbokad eller helg</span></div>
    </section>

    <section class="card side" id="side">
      <div class="shead"><h2>Lediga tider</h2><span id="dlabel">onsdag 14 okt</span></div>
      <div class="slots" id="slots">
        <button class="slot">09:00</button><button class="slot" disabled>10:00</button><button class="slot">11:00</button>
        <button class="slot sel">13:00</button><button class="slot">14:00</button><button class="slot">15:30</button>
      </div>
      <div class="f"><label for="name">Namn</label><input id="name" autocomplete="name" placeholder="Förnamn Efternamn"><div class="msg" id="mName">Fyll i ditt namn</div></div>
      <div class="f"><label for="email">E-post</label><input id="email" type="email" autocomplete="email" placeholder="namn@foretag.se"><div class="msg" id="mEmail">Ange en giltig e-postadress</div></div>
      <div class="summary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="sum"><b>onsdag 14 okt 2026</b> · 13:00–13:45</span></div>
      <button class="cta" id="confirm">Bekräfta bokning</button>
    </section>
  </div>
</div>

<script>
const SLOTS=['09:00','10:00','11:00','13:00','14:00','15:30'];
const MON=['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];
const DAY=['söndag','måndag','tisdag','onsdag','torsdag','fredag','lördag'];
const FULL={'2026-10-6':1,'2026-10-7':1,'2026-10-21':1};
const BUSY={'2026-10-14':[1]};
const booked={};
const $=s=>document.querySelector(s);
const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
const key=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const short=d=>`${d.getDate()} ${MON[d.getMonth()].slice(0,3)} ${d.getFullYear()}`;
const long=d=>`${DAY[d.getDay()]} ${short(d)}`;
const endTime=t=>{const[h,m]=t.split(':').map(Number),x=h*60+m+45;return String(x/60|0).padStart(2,'0')+':'+String(x%60).padStart(2,'0')};
const weekend=d=>d.getDay()===0||d.getDay()===6;
const isFull=d=>!!FULL[key(d)]||(!(d.getFullYear()===2026&&d.getMonth()===9)&&(d.getMonth()*7+d.getDate()*5)%17===3);
function busySlots(d){const k=key(d);const b=BUSY[k]?BUSY[k].slice():[(d.getDate()*7+d.getMonth())%6];if(d.getDate()%3===0)b.push((d.getDate()+2)%6);return b.concat(booked[k]||[])}
function available(d){return d>=today&&!weekend(d)&&!isFull(d)&&busySlots(d).length<SLOTS.length}

const start=new Date(Math.max(new Date(2026,9,1),new Date(today.getFullYear(),today.getMonth(),1)));
let view=new Date(start),sel=null,time='13:00';
const pref=new Date(2026,9,14);
if(available(pref))sel=pref;else{for(let d=new Date(today);!sel;d.setDate(d.getDate()+1))if(available(d))sel=new Date(d)}
view=new Date(sel.getFullYear(),sel.getMonth(),1);

function renderCal(){
  $('#month').textContent=MON[view.getMonth()]+' '+view.getFullYear();
  const first=(view.getDay()+6)%7,n=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  let h='<div class="dow">M</div><div class="dow">T</div><div class="dow">O</div><div class="dow">T</div><div class="dow">F</div><div class="dow">L</div><div class="dow">S</div>'+'<span></span>'.repeat(first);
  for(let i=1;i<=n;i++){const d=new Date(view.getFullYear(),view.getMonth(),i),ok=available(d),c=['d'];
    if(!ok&&!weekend(d)&&d>=today)c.push('full');if(+d===+today)c.push('today');if(sel&&+d===+sel)c.push('sel');
    h+=`<button class="${c.join(' ')}" data-d="${i}" ${ok?'':'disabled'} aria-label="${long(d)}${ok?'':' – ej bokningsbar'}">${i}</button>`}
  $('#days').innerHTML=h;
  $('#prev').disabled=view<=start;
  $('#next').disabled=view>=new Date(start.getFullYear(),start.getMonth()+5,1);
}
function renderSlots(){
  const b=busySlots(sel);if(time&&b.includes(SLOTS.indexOf(time)))time=null;
  $('#dlabel').textContent=DAY[sel.getDay()]+' '+sel.getDate()+' '+MON[sel.getMonth()].slice(0,3);
  $('#slots').innerHTML=SLOTS.map((t,i)=>`<button class="slot${t===time?' sel':''}" data-t="${t}" ${b.includes(i)?'disabled title="Upptagen"':''}>${t}</button>`).join('');
  renderSum();
}
function renderSum(){$('#sum').innerHTML=time?`<b>${long(sel)}</b> · ${time}–${endTime(time)}`:`<b>${long(sel)}</b> · välj en tid`}

let form=$('#side').innerHTML;
function bind(){
  $('#slots').onclick=e=>{const t=e.target.closest('.slot');if(!t||t.disabled)return;time=t.dataset.t;renderSlots()};
  $('#confirm').onclick=submit;
  ['name','email'].forEach(id=>$('#'+id).addEventListener('input',e=>{e.target.classList.remove('err');$(id==='name'?'#mName':'#mEmail').classList.remove('on')}));
}
function submit(){
  const n=$('#name'),m=$('#email');let bad=false;
  if(!n.value.trim()){n.classList.add('err');$('#mName').classList.add('on');bad=true}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m.value.trim())){m.classList.add('err');$('#mEmail').classList.add('on');bad=true}
  if(!time){$('#sum').innerHTML=`<b>${long(sel)}</b> · <span style="color:#d64545">välj en tid först</span>`;bad=true}
  if(bad)return;
  const btn=$('#confirm');btn.classList.add('busy');btn.textContent='Bokar …';
  setTimeout(()=>{
    const k=key(sel);(booked[k]=booked[k]||[]).push(SLOTS.indexOf(time));
    const name=n.value.trim(),mail=m.value.trim();
    $('#side').innerHTML=`<div class="ok"><div class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="#1f9d63" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h2>Mötet är bokat!</h2><p>Tack ${name.split(' ')[0]}! En kalenderinbjudan har skickats till <b>${mail.replace(/</g,'&lt;')}</b>.</p>
    <div class="when"><div><span>Möte</span><b>Bokslutsgenomgång</b></div><div><span>Datum</span><b>${long(sel)}</b></div><div><span>Tid</span><b>${time}–${endTime(time)}</b></div><div><span>Med</span><b>Anna Lindqvist</b></div></div>
    <button class="ghost" id="again">Boka ett nytt möte</button></div>`;
    $('#again').onclick=()=>{$('#side').innerHTML=form;time=null;bind();renderSlots();renderCal()};
    renderCal();
  },650);
}
$('#days').onclick=e=>{const b=e.target.closest('.d');if(!b||b.disabled)return;sel=new Date(view.getFullYear(),view.getMonth(),+b.dataset.d);renderCal();if($('#slots'))renderSlots()};
$('#prev').onclick=()=>{view.setMonth(view.getMonth()-1);renderCal()};
$('#next').onclick=()=>{view.setMonth(view.getMonth()+1);renderCal()};
bind();renderCal();renderSlots();
</script>
</body>
</html>
