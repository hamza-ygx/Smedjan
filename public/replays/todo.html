<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Att göra idag</title>
<style>
:root{--ink:#1b2236;--muted:#6b7385;--faint:#a3a9b7;--line:#e6e8ee;--bg:#f5f6f9;--card:#fff;--accent:#e8590c;--accent-soft:#fff1e8;--ok:#1f9d63;--ok-soft:#e7f6ee;--danger:#d64545}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:radial-gradient(1200px 500px at 50% -10%,#fff 0,var(--bg) 60%);background-color:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:44px 24px 30px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:4px}
h1{font-size:32px;font-weight:750;letter-spacing:-.02em}
h1 span{display:inline-block;padding-bottom:6px;background:linear-gradient(var(--accent),var(--accent)) bottom/100% 4px no-repeat}
.date{font-size:14px;color:var(--muted);font-weight:500;padding-bottom:10px}
.add{display:flex;gap:12px}
.add input{flex:1;min-width:0;height:54px;padding:0 20px;font:inherit;font-size:17px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;outline:0;box-shadow:0 1px 2px rgba(20,30,60,.04),0 8px 24px rgba(20,30,60,.05);transition:border-color .2s,box-shadow .2s}
.add input::placeholder{color:var(--faint)}
.add input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(232,89,12,.12)}
.add button{width:54px;height:54px;flex:none;border:0;border-radius:14px;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 16px rgba(232,89,12,.32);transition:transform .15s,background .15s,box-shadow .15s}
.add button:hover{background:#d24f08;transform:translateY(-1px);box-shadow:0 10px 22px rgba(232,89,12,.36)}
.add button:active{transform:translateY(1px)}
.add svg{width:24px;height:24px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#e9ebf1;border-radius:12px;padding:4px;position:relative}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);background:var(--card);border-radius:9px;box-shadow:0 2px 8px rgba(20,30,60,.1);transform:translateX(calc(var(--i,0)*100%));transition:transform .28s cubic-bezier(.3,.7,.3,1)}
.seg button{position:relative;z-index:1;font:inherit;font-size:15px;font-weight:600;border:0;background:none;height:38px;color:var(--muted);cursor:pointer;transition:color .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button.on{color:var(--ink)}
.seg button.on .n{background:var(--accent);color:#fff}
.n{font-size:12px;font-weight:700;min-width:22px;height:20px;padding:0 6px;border-radius:10px;background:#dcdfe7;color:var(--muted);display:inline-grid;place-items:center;font-variant-numeric:tabular-nums;transition:background .2s,color .2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(20,30,60,.04),0 10px 30px rgba(20,30,60,.06);overflow:hidden}
ul{list-style:none;padding:6px 0}
li{display:flex;align-items:center;gap:16px;padding:0 14px 0 22px;height:58px;position:relative;transition:background .15s}
li+li::before{content:"";position:absolute;top:0;left:22px;right:22px;border-top:1px solid #f0f1f5}
li:hover{background:#fafbfc}
li.in{animation:in .3s ease}
li.out{animation:out .25s ease forwards}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
@keyframes out{to{opacity:0;transform:translateX(16px)}}
.chk{width:24px;height:24px;flex:none;border-radius:7px;border:2px solid #c9cdd8;background:#fff;cursor:pointer;display:grid;place-items:center;padding:0;transition:background .18s,border-color .18s,transform .1s}
.chk:hover{border-color:var(--ok)}
.chk:active{transform:scale(.9)}
.chk svg{width:14px;height:14px;stroke:#fff;stroke-width:3.2;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .25s ease .05s}
li.done .chk{background:var(--ok);border-color:var(--ok)}
li.done .chk svg{stroke-dashoffset:0}
.txt{flex:1;min-width:0;font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;transition:color .25s}
.txt s{text-decoration:none;background:linear-gradient(currentColor,currentColor) left 55%/0 1.5px no-repeat;transition:background-size .3s ease}
li.done .txt{color:var(--faint)}
li.done .txt s{background-size:100% 1.5px}
.del{width:34px;height:34px;flex:none;border:0;border-radius:9px;background:none;color:var(--faint);cursor:pointer;display:grid;place-items:center;opacity:0;transform:scale(.85);transition:opacity .15s,transform .15s,background .15s,color .15s}
li:hover .del,.del:focus-visible{opacity:1;transform:none}
.del:hover{background:#fdecec;color:var(--danger)}
.del svg{width:16px;height:16px}
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:15px;display:none}
.empty b{display:block;font-size:30px;margin-bottom:6px}
.card.none .empty{display:block}
footer{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-top:1px solid var(--line);background:#fbfbfd;font-size:15px;color:var(--muted)}
footer b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{flex:1;max-width:180px;height:6px;border-radius:3px;background:#eceef3;margin:0 20px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .35s ease}
.clear{font:inherit;font-size:15px;font-weight:600;color:var(--muted);background:none;border:0;padding:6px 10px;border-radius:8px;cursor:pointer;transition:background .15s,color .15s}
.clear:hover:not(:disabled){background:var(--accent-soft);color:var(--accent)}
.clear:disabled{opacity:.45;cursor:default}
@media(max-width:560px){header{flex-direction:column;align-items:flex-start;gap:0}.bar{display:none}h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>Att göra idag</span></h1>
    <div class="date" id="date">tisdag 6 okt 2026</div>
  </header>

  <form class="add" id="form" autocomplete="off">
    <input id="new" placeholder="Ny uppgift…" aria-label="Ny uppgift" maxlength="80">
    <button type="submit" aria-label="Lägg till"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </form>

  <div class="seg" id="seg" role="tablist">
    <button class="on" data-f="all" role="tab">Alla <span class="n" id="cAll">5</span></button>
    <button data-f="active" role="tab">Aktiva <span class="n" id="cActive">3</span></button>
    <button data-f="done" role="tab">Klara <span class="n" id="cDone">2</span></button>
  </div>

  <div class="card" id="card">
    <ul id="list">
      <li class="done"><button class="chk"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></button><span class="txt"><s>Bokslut Andersson AB</s></span><button class="del"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></li>
      <li><button class="chk"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></button><span class="txt"><s>Ring Skatteverket</s></span><button class="del"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></li>
      <li><button class="chk"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></button><span class="txt"><s>Momsdeklaration Q3</s></span><button class="del"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></li>
      <li class="done"><button class="chk"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></button><span class="txt"><s>Skicka fakturor</s></span><button class="del"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></li>
      <li><button class="chk"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></button><span class="txt"><s>Fika 15:00 ☕</s></span><button class="del"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></li>
    </ul>
    <div class="empty" id="empty"><b id="emptyIco">✨</b><span id="emptyTxt">Inga uppgifter här</span></div>
    <footer>
      <span><b id="left">3</b> kvar</span>
      <div class="bar"><i id="bar" style="width:40%"></i></div>
      <button class="clear" id="clear">Rensa klara</button>
    </footer>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const ICON_CHK='<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
const ICON_DEL='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>';
let id=0,filter='all';
let tasks=[...document.querySelectorAll('#list li')].map(li=>({id:++id,text:li.querySelector('.txt').textContent,done:li.classList.contains('done')}));
const list=$('#list'),card=$('#card');

const d=new Date();
$('#date').textContent=new Intl.DateTimeFormat('sv-SE',{weekday:'long',day:'numeric',month:'short',year:'numeric'}).format(d).replace('.','');

function row(t){
  const li=document.createElement('li');
  li.dataset.id=t.id;li.className=t.done?'done':'';
  li.innerHTML=`<button class="chk" aria-label="Markera som klar">${ICON_CHK}</button><span class="txt"><s></s></span><button class="del" aria-label="Ta bort">${ICON_DEL}</button>`;
  li.querySelector('s').textContent=t.text;
  return li;
}
function visible(t){return filter==='all'||(filter==='done')===t.done}
function render(newId){
  list.innerHTML='';
  const shown=tasks.filter(visible);
  shown.forEach(t=>{const li=row(t);if(t.id===newId)li.classList.add('in');list.appendChild(li)});
  card.classList.toggle('none',!shown.length);
  $('#emptyIco').textContent=filter==='done'?'📋':filter==='active'?'🎉':'✨';
  $('#emptyTxt').textContent=filter==='done'?'Inga klara uppgifter ännu':filter==='active'?'Allt är klart – bra jobbat!':'Inga uppgifter – lägg till en ovan';
  stats();
}
function stats(){
  const done=tasks.filter(t=>t.done).length,left=tasks.length-done;
  $('#cAll').textContent=tasks.length;$('#cActive').textContent=left;$('#cDone').textContent=done;
  $('#left').textContent=left;
  $('#bar').style.width=(tasks.length?done/tasks.length*100:0)+'%';
  $('#clear').disabled=!done;
}

list.addEventListener('click',e=>{
  const li=e.target.closest('li');if(!li)return;
  const t=tasks.find(x=>x.id==li.dataset.id);
  if(e.target.closest('.chk')){
    t.done=!t.done;li.classList.toggle('done',t.done);stats();
    if(!visible(t)){li.classList.add('out');setTimeout(render,250)}
  }else if(e.target.closest('.del')){
    tasks=tasks.filter(x=>x!==t);li.classList.add('out');stats();setTimeout(render,250);
  }
});

$('#form').addEventListener('submit',e=>{
  e.preventDefault();
  const inp=$('#new'),text=inp.value.trim();
  if(!text){inp.focus();return}
  const t={id:++id,text,done:false};
  tasks.unshift(t);inp.value='';
  if(filter==='done')setFilter('active');
  render(t.id);
});

function setFilter(f){
  filter=f;
  const btns=[...document.querySelectorAll('#seg button')];
  btns.forEach((b,i)=>{b.classList.toggle('on',b.dataset.f===f);if(b.dataset.f===f)$('#seg').style.setProperty('--i',i)});
}
$('#seg').addEventListener('click',e=>{const b=e.target.closest('button');if(b){setFilter(b.dataset.f);render()}});

$('#clear').addEventListener('click',()=>{
  const outs=[...list.querySelectorAll('li.done')];
  outs.forEach(li=>li.classList.add('out'));
  tasks=tasks.filter(t=>!t.done);stats();
  setTimeout(render,outs.length?250:0);
});

render();
</script>
</body>
</html>
