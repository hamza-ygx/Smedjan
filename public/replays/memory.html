<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory</title>
<style>
:root{--ink:#1b2236;--muted:#6b7385;--line:#e6e8ee;--bg:#f5f6f9;--card:#fff;--accent:#e8590c;--accent-2:#f08a3c;--accent-soft:#fff1e8;--glow:#ffb547}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:radial-gradient(1100px 520px at 50% -10%,#fff 0,var(--bg) 60%);background-color:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{width:min(100%,532px);margin:0 auto;padding:20px 20px 18px;display:flex;flex-direction:column;gap:12px}
h1{font-size:32px;font-weight:780;letter-spacing:-.02em;text-align:center}
h1 span{display:inline-block;padding-bottom:6px;background:linear-gradient(var(--accent),var(--accent)) bottom/100% 4px no-repeat}
.stats{display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:baseline;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:7px 13px;font-size:13.5px;color:var(--muted);font-weight:600;box-shadow:0 1px 2px rgba(20,30,60,.04)}
.pill b{font-size:17px;color:var(--ink);font-weight:750;font-variant-numeric:tabular-nums}
.pill.best{margin-left:auto;background:none;border-color:transparent;box-shadow:none;padding-right:0}
.pill.best b{font-size:14.5px;color:var(--accent)}
.prog{height:6px;border-radius:3px;background:#e6e8ee;overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .5s cubic-bezier(.3,.7,.3,1)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{font:inherit;aspect-ratio:1;border:0;padding:0;background:none;cursor:pointer;perspective:800px;border-radius:16px;-webkit-tap-highlight-color:transparent}
.card:focus-visible{outline:3px solid rgba(232,89,12,.4);outline-offset:3px}
.in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.2,.2,1.2)}
.card.up .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.back{background:repeating-linear-gradient(135deg,rgba(255,255,255,.13) 0 6px,transparent 6px 14px),linear-gradient(145deg,var(--accent-2),var(--accent) 70%);box-shadow:0 1px 2px rgba(20,30,60,.08),0 8px 18px rgba(232,89,12,.2),inset 0 0 0 1px rgba(255,255,255,.18);transition:transform .18s,box-shadow .18s}
.back::after{content:"";width:34px;height:34px;border-radius:10px;border:2.5px solid rgba(255,255,255,.55);transform:rotate(45deg)}
.card:not(.up):hover .back{transform:translateY(-3px);box-shadow:0 2px 4px rgba(20,30,60,.08),0 14px 26px rgba(232,89,12,.3),inset 0 0 0 1px rgba(255,255,255,.25)}
.front{background:var(--card);border:1.5px solid var(--line);transform:rotateY(180deg);box-shadow:0 1px 2px rgba(20,30,60,.04),0 8px 20px rgba(20,30,60,.07);transition:border-color .3s,box-shadow .4s,background .4s}
.front .e{font-size:46px;line-height:1}
.front small{font-size:12.5px;font-weight:650;color:var(--muted);letter-spacing:.01em}
.card.done{cursor:default}
.card.done .front{border-color:var(--glow);background:linear-gradient(180deg,#fff,#fff8ec);box-shadow:0 0 0 3px rgba(255,181,71,.25),0 0 26px rgba(255,170,50,.45);animation:glow 1.1s ease}
.card.done .front small{color:#b5651d}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(255,181,71,.7),0 0 0 rgba(255,170,50,0)}45%{box-shadow:0 0 0 10px rgba(255,181,71,0),0 0 46px rgba(255,170,50,.8)}}
.card.done .e{animation:hop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{40%{transform:scale(1.25)}}
.card.miss .front{border-color:#f0a5a5;animation:shake .4s .45s}
@keyframes shake{20%,60%{transform:rotateY(180deg) translateX(-4px)}40%,80%{transform:rotateY(180deg) translateX(4px)}}
.btn{font:inherit;align-self:center;font-size:17px;font-weight:700;height:50px;padding:0 34px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:0 1px 2px rgba(20,30,60,.05),0 6px 16px rgba(20,30,60,.06);transition:transform .15s,box-shadow .15s,border-color .15s}
.btn:hover{transform:translateY(-1px);border-color:#cfd3dd;box-shadow:0 10px 22px rgba(20,30,60,.1)}
.btn svg{width:18px;height:18px;transition:transform .35s}
.btn:hover svg{transform:rotate(-180deg)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(232,89,12,.3)}
.btn.primary:hover{background:#d24f08;box-shadow:0 10px 22px rgba(232,89,12,.36)}
.win{position:fixed;inset:0;display:grid;place-items:center;background:rgba(27,34,54,.28);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s;z-index:5}
.win.show{opacity:1;pointer-events:auto}
.box{background:var(--card);border-radius:22px;padding:30px 40px 28px;text-align:center;box-shadow:0 30px 70px rgba(20,30,60,.3);transform:translateY(16px) scale(.96);transition:transform .45s cubic-bezier(.3,1.5,.5,1);min-width:340px}
.win.show .box{transform:none}
.box .t{font-size:56px;line-height:1}
.box h2{font-size:28px;font-weight:780;letter-spacing:-.02em;margin:10px 0 4px}
.box p{color:var(--muted);font-size:15.5px;margin-bottom:18px}
.res{display:flex;justify-content:center;gap:12px;margin-bottom:22px}
.res div{background:var(--bg);border-radius:12px;padding:10px 20px;min-width:96px}
.res b{display:block;font-size:24px;font-weight:780;font-variant-numeric:tabular-nums}
.res span{font-size:12.5px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.05em}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
@media(max-width:520px){.grid{gap:8px}.front .e{font-size:32px}.front small{display:none}.pill.best{display:none}.box{min-width:0;margin:0 16px;padding:24px}}
</style>
</head>
<body>
<main class="wrap">
  <h1><span>Memory</span></h1>

  <div class="stats">
    <div class="pill">Drag <b id="moves">0</b></div>
    <div class="pill">Tid <b id="time">0:00</b></div>
    <div class="pill">Par <b id="pairs">0/8</b></div>
    <div class="pill best">Bästa: <b id="best">–</b></div>
  </div>
  <div class="prog"><i id="bar"></i></div>

  <section class="grid" id="grid">
    <button class="card"><div class="in"><div class="face back"></div><div class="face front"><span class="e">💰</span><small>Intäkter</small></div></div></button>
    <button class="card"><div class="in"><div class="face back"></div><div class="face front"><span class="e">📊</span><small>Rapport</small></div></div></button>
    <button class="card"><div class="in"><div class="face back"></div><div class="face front"><span class="e">🧾</span><small>Kvitto</small></div></div></button>
    <button class="card"><div class="in"><div class="face back"></div><div class="face front"><span class="e">💼</span><small>Uppdrag</small></div></div></button>
    <button class="card"><div class="in"><div class="face back"></div><div class="face front"><span class="e">📈</span><small>Tillväxt</small></div></div></button>
    <button class="card"><div class="in"><div class="face back"></div><div class="face front"><span class="e">🏦</span><small>Bank</small></div></div></button>
    <button class="card"><div class="in"><div class="face back"></div><div class="face front"><span class="e">🧮</span><small>Kalkyl</small></div></div></button>
    <button class="card"><div class="in"><div class="face back"></div><div class="face front"><span class="e">📅</span><small>Bokslut</small></div></div></button>
    <button class="card"><div class="in"><div class="face back"></div><div class="face front"><span class="e">💰</span><small>Intäkter</small></div></div></button>
    <button class="card"><div class="in"><div class="face back"></div><div class="face front"><span class="e">📊</span><small>Rapport</small></div></div></button>
    <button class="card"><div class="in"><div class="face back"></div><div class="face front"><span class="e">🧾</span><small>Kvitto</small></div></div></button>
    <button class="card"><div class="in"><div class="face back"></div><div class="face front"><span class="e">💼</span><small>Uppdrag</small></div></div></button>
    <button class="card"><div class="in"><div class="face back"></div><div class="face front"><span class="e">📈</span><small>Tillväxt</small></div></div></button>
    <button class="card"><div class="in"><div class="face back"></div><div class="face front"><span class="e">🏦</span><small>Bank</small></div></div></button>
    <button class="card"><div class="in"><div class="face back"></div><div class="face front"><span class="e">🧮</span><small>Kalkyl</small></div></div></button>
    <button class="card"><div class="in"><div class="face back"></div><div class="face front"><span class="e">📅</span><small>Bokslut</small></div></div></button>
  </section>

  <button class="btn" id="restart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Starta om</button>
</main>

<div class="win" id="win" role="dialog" aria-live="polite">
  <div class="box">
    <div class="t">🏆</div>
    <h2>Snyggt jobbat!</h2>
    <p id="winMsg">Alla par hittade.</p>
    <div class="res"><div><b id="wMoves">0</b><span>Drag</span></div><div><b id="wTime">0:00</b><span>Tid</span></div></div>
    <button class="btn primary" id="again"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Spela igen</button>
  </div>
</div>
<canvas id="fx"></canvas>

<script>
const DECK=[['💰','Intäkter'],['📊','Rapport'],['🧾','Kvitto'],['💼','Uppdrag'],['📈','Tillväxt'],['🏦','Bank'],['🧮','Kalkyl'],['📅','Bokslut']];
const $=id=>document.getElementById(id);
const cards=[...document.querySelectorAll('.card')];
let open=[],lock=false,moves=0,found=0,start=0,timer=null,secs=0,best=null;
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const nf=new Intl.NumberFormat('sv-SE');

function deal(){
  const keys=[...DECK.keys(),...DECK.keys()];
  for(let i=keys.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[keys[i],keys[j]]=[keys[j],keys[i]]}
  cards.forEach((c,i)=>{
    c.className='card';c.dataset.k=keys[i];c.disabled=false;
    const[e,l]=DECK[keys[i]];c.querySelector('.e').textContent=e;c.querySelector('small').textContent=l;
    c.setAttribute('aria-label','Dolt kort');
  });
}

function reset(){
  clearInterval(timer);timer=null;open=[];lock=false;moves=0;found=0;secs=0;
  $('win').classList.remove('show');
  const anyUp=cards.some(c=>c.classList.contains('up'));
  cards.forEach(c=>c.classList.remove('up','done','miss'));
  setTimeout(deal,anyUp?560:0);
  render();
}

function render(){
  $('moves').textContent=nf.format(moves);$('time').textContent=fmt(secs);
  $('pairs').textContent=found+'/8';$('bar').style.width=(found/8*100)+'%';
}

function flip(c){
  if(lock||c.classList.contains('up'))return;
  if(!timer){start=Date.now()-secs*1000;timer=setInterval(()=>{secs=Math.floor((Date.now()-start)/1000);render()},250)}
  c.classList.add('up');c.setAttribute('aria-label',DECK[c.dataset.k][1]);open.push(c);
  if(open.length<2)return;
  moves++;const[a,b]=open;open=[];
  if(a.dataset.k===b.dataset.k){
    found++;
    setTimeout(()=>{[a,b].forEach(x=>{x.classList.add('done');x.disabled=true})},380);
    if(found===8)setTimeout(win,900);
  }else{
    lock=true;[a,b].forEach(x=>x.classList.add('miss'));
    setTimeout(()=>{[a,b].forEach(x=>{x.classList.remove('up','miss');x.setAttribute('aria-label','Dolt kort')});lock=false},1050);
  }
  render();
}

function win(){
  clearInterval(timer);timer=null;secs=Math.floor((Date.now()-start)/1000);render();
  const rec=best===null||moves<best.m||(moves===best.m&&secs<best.s);
  if(rec)best={m:moves,s:secs};
  $('best').textContent=best.m+' drag · '+fmt(best.s);
  $('wMoves').textContent=nf.format(moves);$('wTime').textContent=fmt(secs);
  $('winMsg').textContent=rec?'Nytt personligt rekord – alla 8 par hittade.':'Alla 8 par hittade. Rekordet är '+best.m+' drag.';
  $('win').classList.add('show');confetti();
}

const cv=$('fx'),ctx=cv.getContext('2d');let parts=[],raf=0;
function confetti(){
  const dpr=window.devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#e8590c','#f08a3c','#ffb547','#1b2236','#2f9e6b','#4c6ef5','#ffd43b'];
  for(let i=0;i<220;i++){const left=i%2===0;parts.push({x:left?-10:innerWidth+10,y:innerHeight*(.55+Math.random()*.3),vx:(left?1:-1)*(5+Math.random()*9),vy:-(9+Math.random()*11),w:6+Math.random()*7,h:9+Math.random()*9,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length],o:1})}
  if(!raf)tick();
}
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.y<innerHeight+40&&p.o>0);
  for(const p of parts){
    p.vy+=.32;p.vx*=.985;p.vy*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.vy>0)p.o-=.004;
    ctx.save();ctx.globalAlpha=Math.max(p.o,0);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.scale(1,Math.cos(p.r*2));
    ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
  }
  raf=parts.length?requestAnimationFrame(tick):0;
  if(!raf)ctx.clearRect(0,0,innerWidth,innerHeight);
}

$('grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)flip(c)});
$('restart').addEventListener('click',reset);
$('again').addEventListener('click',reset);
deal();render();
</script>
</body>
</html>
