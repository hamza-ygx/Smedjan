<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Förhandsvisning</title>
<style>html, body { margin: 0; height: 100%; background: #fff; }</style>
</head>
<body>
<script>
  // Runs in a sandbox="allow-scripts" iframe (opaque origin), so the generated app
  // cannot reach the presenter UI. Each build replaces this document via
  // document.open() and is streamed in with document.write(), which lets the browser
  // parse and paint the app progressively as the code arrives.
  // document.open() erases listeners on the window, so we re-attach after each one.
  (function () {
    let building = false;
    let lastScroll = 0;

    function reset() {
      document.open();
      window.addEventListener("message", onMessage);
    }

    function follow() {
      const now = performance.now();
      if (now - lastScroll < 120) return;
      lastScroll = now;
      const el = document.scrollingElement || document.documentElement;
      if (!el) return;
      const max = el.scrollHeight - el.clientHeight;
      if (max > 0) window.scrollTo({ top: max, behavior: "smooth" });
    }

    function onMessage(e) {
      if (e.source !== window.parent) return;
      const m = e.data || {};
      if (!m.__smedjan) return;
      try {
        if (m.type === "ping") parent.postMessage({ __smedjan: true, type: "pong" }, "*");
        else if (m.type === "begin") { reset(); building = true; }
        else if (m.type === "chunk" && building) { document.write(m.html); follow(); }
        else if (m.type === "end" && building) {
          building = false;
          document.close();
          setTimeout(() => window.scrollTo({ top: 0, behavior: "smooth" }), 400);
        }
        else if (m.type === "load") { reset(); document.write(m.html); document.close(); building = false; }
      } catch (err) {
        parent.postMessage({ __smedjan: true, type: "preview-error", message: String(err) }, "*");
      }
    }

    window.addEventListener("message", onMessage);
    parent.postMessage({ __smedjan: true, type: "preview-ready" }, "*");
  })();
</script>
</body>
</html>
